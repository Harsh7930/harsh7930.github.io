<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>External Post {{ post_id }} | Lecture 28</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #172554; background: #eff6ff; }
    .card { width: min(720px, 100%); padding: 38px; border-radius: 22px; background: white; box-shadow: 0 18px 45px rgba(30,64,175,.16); }
    .label { color: #2563eb; font-size: .82rem; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 12px 0; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.2; text-transform: capitalize; }
    p { color: #475569; font-size: 1.08rem; line-height: 1.7; }
    .meta { margin-top: 26px; padding-top: 18px; border-top: 1px solid #e2e8f0; color: #64748b; }
    .error { color: #991b1b; background: #fef2f2; }
    a { color: #2563eb; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <article class="card{% if error %} error{% endif %}">
    {% if error %}
      <span class="label">SERVICE UNAVAILABLE</span>
      <h1>We could not load the external post.</h1>
      <p>{{ error }}</p>
    {% else %}
      <span class="label">EXTERNAL POST #{{ post.id }}</span>
      <h1>{{ post.title }}</h1>
      <p>{{ post.body }}</p>
      <p class="meta">Provided by JSONPlaceholder • User {{ post.userId }}</p>
    {% endif %}
    <a href="/">← Back to API Explorer</a>
  </article>
</body>
</html>
