<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES6 To-Do App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <p><a href="../index.html">&larr; Back to Experiment 07 &amp; 08</a></p>
        <h1>My To-Do List</h1>
        <p class="intro">Add a task, mark it done, or remove it when you finish.</p>

        <form id="taskForm" class="add-task">
            <label class="visually-hidden" for="taskInput">New task</label>
            <input type="text" id="taskInput" placeholder="Enter a task..." autocomplete="off" maxlength="120">
            <button id="addBtn" type="submit">Add task</button>
        </form>
        <p id="statusMessage" role="status" aria-live="polite"></p>
        <p id="taskSummary" class="task-summary"></p>

        <ul id="taskList" aria-label="Your tasks"></ul>
    </main>

    <script src="app.js"></script>
</body>
</html>
